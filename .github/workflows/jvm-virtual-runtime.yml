name: JVM virtual runtime threads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [platform, virtual]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        env:
          EMITTER_SOURCE: ${{ runner.temp }}/emitter
        run: |
          haxelib install hxjava 4.2.0 --always --quiet
          haxelib install utest 1.13.2 --always --quiet
          git init --quiet "$EMITTER_SOURCE"
          git -C "$EMITTER_SOURCE" fetch --depth 1 https://github.com/Dimensionscape/Emitter.git 06b396f584271e24a7dc18dcfadfd020c567cc6a
          git -C "$EMITTER_SOURCE" checkout --quiet --detach FETCH_HEAD
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          global_repo = Path(subprocess.check_output(['haxelib', 'config'], text=True).strip())
          libraries = {'crossbyte': root, 'emitter': Path(os.environ['EMITTER_SOURCE']),
                       'hxjava': global_repo / 'hxjava/4,2,0', 'utest': global_repo / 'utest/1,13,2'}
          for name, path in libraries.items():
              folder = root / '.haxelib' / name
              folder.mkdir(parents=True)
              version = json.loads((path / 'haxelib.json').read_text())['version']
              (folder / '.dev').write_text(str(path) + '\n')
              (folder / '.current').write_text(version + '\n')
              (folder / version.replace('.', ',')).symlink_to(path, target_is_directory=True)
          PY
      - name: Verify thread type, HTTP I/O and lifecycle
        env:
          RUNTIME_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [ "$RUNTIME_MODE" = virtual ]; then DEFINE='-D crossbyte_jvm_virtual_threads'; else DEFINE=''; fi
          haxe ci/jvm-virtual-runtime.hxml $DEFINE
          java -jar export/jvm/CrossByteVirtualRuntime.jar
          java -jar export/jvm/CrossByteVirtualRuntime.jar --liveness | tee export/jvm/liveness.log
          grep -q VIRTUAL_RUNTIME_LIVENESS_OK export/jvm/liveness.log
      - name: Run the upstream JVM test suite
        env:
          RUNTIME_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [ "$RUNTIME_MODE" = virtual ]; then DEFINE='-D crossbyte_jvm_virtual_threads'; else DEFINE=''; fi
          haxe ci/jvm-tests.hxml $DEFINE
          java -jar export/jvm/CrossByteTests.jar | tee export/jvm/upstream-tests.log
      - name: Preserve JVM test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvm-runtime-${{ matrix.mode }}
          path: export/jvm/*.log
